<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="details.css">
    <link rel="icon" type="image/x-icon" href="./asset/favicon.ico">
    <script src="app.js"></script>
    <title>Comic Detail</title>
</head>
<style>
    #comic-details {
  max-width: 700px;
  margin: 40px auto;
  padding: 25px;
  background-color: #ffc757e8;
  border-radius: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #333;
  text-align: center;
}

#comic-title {
  font-size: 2.5rem;
  margin-bottom: 20px;
  color: #2c3e50;
}

#comic-cover {
  border-radius: 12px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  margin-bottom: 25px;
  max-width: 100%;
  height: auto;
}

#comic-description {
  font-size: 1.1rem;
  line-height: 1.5;
  margin-bottom: 25px;
  color: #555;
}

#comic-details p {
  font-size: 1rem;
  margin: 8px 0;
}

#comic-details strong {
  color: #34495e;
}
#add-to-cart {
  background-color: #27ae60;
  color: white;
  border: none;
  padding: 12px 25px;
  font-size: 1rem;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.3s ease, transform 0.2s ease;
  margin-top: 20px;
}

#add-to-cart:hover {
  background-color: #219150;
  transform: scale(1.05);
}

#add-to-cart:active {
  background-color: #1e8449;
  transform: scale(0.98);
}
#cart-message{
  margin-top: 1em;
}
</style>
<body>
    <header>
        <div class="logo">
            <img src="./asset/Bangers.png" alt="ReadMe Logo">
            <h1>ReadMe <span>DIGITAL COMIC BOOKSTORE</span></h1>
        </div>
        <div class="icons">
            <i class="fas fa-cog" onclick="window.location.href='settings.html'"></i>
            <i class="fas fa-user-circle"></i>
            <div id="user-menu" style="display: none;">
                <button class="menu-button" onclick="window.location.href='bookshelf.html'">My Bookshelf</button>
                <button class="menu-button" onclick="window.location.href='orderhistory.html'">Order History</button>
                <button class="menu-button" onclick="window.location.href='index.php'">Log Out</button>
            </div>
            <i class="fas fa-shopping-cart" onclick="window.location.href='cart.html'"></i>
        </div>
    </header>
    <div class="navigator">
        <nav>
            <a class="first" href="homepage.html">Home</a>
            <a class="selected" href="browse.html">Browse Comic</a>
            <a href="feedback.html">Feedback</a>
            <input class="search-box" type="text" placeholder="Search">
            <button id="search"><i class="fas fa-search"></i></button>
        </nav>    
    </div>

    <div id="comic-details">
        <h1 id="comic-title"></h1>
        <img id="comic-cover" src="" alt="Comic Cover" width="200">

        <p id="comic-description"></p>
        <p><strong>Genre:</strong> <span id="comic-genre"></span></p>
        <p><strong>Author:</strong> <span id="comic-author"></span></p>
        <p><strong>Price:</strong> <span id="comic-price"></span></p>

        <button id="add-to-cart">Add to Cart</button>
        <div id="cart-message"></div>

    </div>



    
</body>
</html>
