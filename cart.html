<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styleforcart.css">
    <link rel="icon" type="image/x-icon" href="./asset/favicon.ico">
    <title>Your Cart</title>
</head>
<style>
    .cart-table {
        margin: auto;
    width: 92%;
    border-collapse: collapse;
    margin-top: 1rem;
    font-family: Arial, sans-serif;
}

.cart-table th,
.cart-table td {
    border: 1.5px solid black;
    padding: 10px;
    text-align: left;
}

.cart-table th {
    background-color: #ffc857;
    font-weight: bold;
}

.cart-table tr:nth-child(even) {
    background-color: #f9f9f9;
}

.remove-btn {
    padding: 6px 12px;
    background-color: #e74c3c;
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 4px;
    text-align: center;
}

.remove-btn:hover {
    background-color: #c0392b;
}
.sub{
    margin-top: 0.9em;
    margin-bottom: 1em;
    margin-left: 1em;
    font-size: xx-large;
}
.cart-container p {
    text-align: center;
    font-size: x-large;
    margin-top: 6em;
}


</style>
<body>
    <header>
        <div class="logo">
            <img src="./asset/Bangers.png" alt="ReadMe Logo">
            <h1>ReadMe <span>DIGITAL COMIC BOOKSTORE</span></h1>
        </div>
        <div class="icons">
            <i class="fas fa-cog" onclick="window.location.href='settings.html'"></i>
            <i class="fas fa-user-circle"></i>
            <div id="user-menu" style="display: none;">
                <button class="menu-button" onclick="window.location.href='bookshelf.html'">My Bookshelf</button>
                <button class="menu-button" onclick="window.location.href='orderhistory.html'">Order History</button>
                <button class="menu-button" onclick="window.location.href='index.php'">Log Out</button>
            </div>
            <i class="fas fa-shopping-cart"></i>
        </div>
    </header>
    <div class="navigator">
        <nav>
            <a class="first" href="homepage.html">Home</a>
            <a href="browse.html">Browse Comic</a>
            <a href="feedback.html">Feedback</a>
            <input class="search-box" type="text" placeholder="Search">
            <button id="search"><i class="fas fa-search"></i></button>
        </nav>
    </div>
    <main>
            <h1 class="sub">Shopping Cart</h1>
            <div class="cart-container"></div>
    </main>
    <script src="jscart.js"></script>
    
</body>
</html>
