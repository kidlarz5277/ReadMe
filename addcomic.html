<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="dash.css">
    <link rel="icon" type="image/x-icon" href="./asset/favicon.ico">
    <title>Add Comic Book</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="./asset/Bangers.png" alt="ReadMe Logo">
            <h1>ReadMe <span>DIGITAL COMIC BOOKSTORE</span></h1>
        </div>
    </header>

    <div class="top">
        <a class="topclick" onclick="window.location.href='admin.html'">DashBoard</a>
    </div>
    
    <h2>ADD COMIC</h2>

    <main>
        <div class="container">
            <form class="addform" action="add_comic.php" method="post" enctype="multipart/form-data">
                <div class="add">
                    <input type="text" name="title" placeholder="Title" required>
                </div>

                <div class="add">
                    <input type="text" name="author" placeholder="Author" required>
                </div>

                <div class="add">
                    <input type="text" name="genre" placeholder="Genre" required>
                </div>

                <div class="add">
                    <input type="number" step="0.01" name="price" placeholder="Price" required>
                </div>

                <div class="desc">
                    <textarea name="description" placeholder="Description" rows="7" required></textarea>
                </div>

                <div class="add">
                    <label for="comicFile">Upload Comic File:</label>
                    <input type="file" name="comicFile" id="comicFile" accept=".pdf,.cbz,.cbr" required>
                </div>

                <div class="add">
                    <label for="coverImage">Upload Cover Page:</label>
                    <input type="file" name="coverImage" id="coverImage" accept="image/png, image/jpeg" required>
                </div>

                <button id="submit" type="submit">Add Comic</button>
            </form>
        </div>
    </main>
</body>
</html>
