<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="homepage.css">
    <link rel="icon" type="image/x-icon" href="./asset/favicon.ico">
    <title>Settings</title>
</head>
<body>

    <header>
        <div class="logo">
            <img src="./asset/Bangers.png" alt="ReadMe Logo">
            <h1>ReadMe <span>DIGITAL COMIC BOOKSTORE</span></h1>
        </div>
        <div class="icons">
            <i class="fas fa-cog"></i>
            <i class="fas fa-user-circle"></i>
            <div id="user-menu" style="display: none;">
                <button class="menu-button" onclick="window.location.href='bookshelf.html'">My Bookshelf</button>
                <button class="menu-button" onclick="window.location.href='orderhistory.html'">Order History</button>
                <button class="menu-button" onclick="window.location.href='index.php'">Log Out</button>
            </div>
            <i class="fas fa-shopping-cart" onclick="window.location.href='cart.html'"></i>
        </div>
    </header>
    <div class="navigator">
        <nav>
            <a class="first" href="homepage.html">Home</a>
            <a href="browse.html">Browse Comic</a>
            <a href="feedback.html">Feedback</a>
            <input class="search-box" type="text" placeholder="Search">
            <button id="search"><i class="fas fa-search"></i></button>
        </nav>    
    </div>

    <div class="contain">
        <aside class="sidebar">
            <nav class="side">
                <ul>
                    <li><button>Language</button></li>
                    <li><button>Change Password</button></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <div class="welcome-box">
                
              </div>
        </main>
    </div>
     <script>
    document.addEventListener("DOMContentLoaded", () => {
    initUserMenu();
    initChangePasswordButton();
});

function initChangePasswordButton() {
    const changePasswordButton = document.querySelector(".sidebar .side ul li:nth-child(2) button");
    const welcomeBox = document.querySelector(".welcome-box");

    if (changePasswordButton && welcomeBox) {
        changePasswordButton.addEventListener("click", () => {
            welcomeBox.innerHTML = `
                <div class="change-password-form">
                    <h2>Change Password</h2>
                    <form>
                        <label for="current-password">Current Password:</label>
                        <input type="password" id="current-password" name="current-password" required>
                        <label for="new-password">New Password:</label>
                        <input type="password" id="new-password" name="new-password" required>
                        <label for="confirm-password">Confirm New Password:</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                        <button type="submit">Submit</button>
                    </form>
                </div>
            `;
        });
    }
}

    </script>
</body>
</html>
